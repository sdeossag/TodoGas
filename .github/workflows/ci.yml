name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar Ruff
        run: pip install ruff

      - name: Correr Ruff
        run: ruff check backend/
        # No falla el pipeline por warnings de estilo,
        # solo por errores criticos (imports no usados, sintaxis, etc.)

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: todogas_test
          POSTGRES_USER: todogas_user
          POSTGRES_PASSWORD: todogas_test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout codigo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias del sistema (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libffi-dev \
            libcairo2 \
            libgdk-pixbuf-2.0-0

      - name: Instalar dependencias Python
        run: pip install -r backend/requirements-dev.txt

      - name: Verificar que manage.py check pasa
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          DB_NAME: todogas_test
          DB_USER: todogas_user
          DB_PASSWORD: todogas_test_pass
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py check

      - name: Verificar que no falten migraciones por generar
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          DB_NAME: todogas_test
          DB_USER: todogas_user
          DB_PASSWORD: todogas_test_pass
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py makemigrations --check --dry-run
        # Sale con codigo 1 si un modelo cambio sin su migracion.
        # Obliga a hacer makemigrations antes de abrir el PR.
        #
        # No usar `migrate --check`: ese comprueba migraciones sin APLICAR, y
        # contra la base recien creada del job siempre serian todas.

      - name: Correr migraciones
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          DB_NAME: todogas_test
          DB_USER: todogas_user
          DB_PASSWORD: todogas_test_pass
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: python manage.py migrate

      - name: Correr tests
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          DB_NAME: todogas_test
          DB_USER: todogas_user
          DB_PASSWORD: todogas_test_pass
          DB_HOST: localhost
          DB_PORT: 5432
          REDIS_URL: redis://localhost:6379/0
        run: |
          coverage run -m pytest apps/ -v --tb=short
          coverage report --fail-under=0
          # El flag es --fail-under; --min-coverage no existe en coverage.py
          # y hacia fallar el paso entero.
          # Umbral en 0 por ahora: subirlo a 70 cuando la cobertura de los
          # modulos criticos (users, work_orders, audit) este medida.
